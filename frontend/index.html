<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Assignments</title>
    <script id="gsi" src="https://accounts.google.com/gsi/client" async></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        width: 100%;
        height: 100vh;
      }
      /* Always-visible horizontal scrollbar (macOS hides them by default).
         Only shows when the text overflows. */
      .scroll-x {
        overflow-x: auto;
        white-space: nowrap;
        padding-bottom: 8px;
      }
      .scroll-x::-webkit-scrollbar {
        height: 6px;
      }
      .scroll-x::-webkit-scrollbar-thumb {
        background: #bbb;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
